# gitleaks (run in CI): its default rules, less one public value that is not a secret.
[extend]
useDefault = true

[[allowlists]]
description = "An RSA public key (the Chrome extension's, in extension/id.ts: Chrome derives the extension's ID from it)"
regexTarget = "match"
regexes = ['''MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA[A-Za-z0-9+/=]+''']
